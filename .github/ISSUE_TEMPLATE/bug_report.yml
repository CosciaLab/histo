name: Bug report
description: Report something that is broken or incorrect
labels: bug
body:
  - type: markdown
    attributes:
      value: |
        Before posting, please check:

        - [ROADMAP.md](https://github.com/CosciaLab/histo/blob/main/ROADMAP.md) — known limitations and open work
        - [docs/usage.md](https://github.com/CosciaLab/histo/blob/main/docs/usage.md) — parameters and profiles
        - [Nextflow troubleshooting](https://www.nextflow.io/docs/latest/troubleshooting.html)
  - type: textarea
    id: description
    attributes:
      label: Description of the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: command_used
    attributes:
      label: Command used and terminal output
      description: Steps to reproduce the behaviour. Please paste the command you used to launch the pipeline and the output from your terminal.
      render: console
      placeholder: |
        $ nextflow run ...

        Some output where something broke

  - type: textarea
    id: files
    attributes:
      label: Relevant files
      description: |
        Please drag and drop the relevant files here. Create a `.zip` archive if the extension is not allowed.
        Useful: `.nextflow.log` _(hidden, in the launch directory)_, the failing task's `.command.err`, `.command.out` and `.command.log` _(in its `work/` directory)_, your params file and any custom config.

  - type: textarea
    id: system
    attributes:
      label: System information
      description: |
        * Nextflow version _(eg. 25.10.4)_
        * Hardware _(eg. HPC, Desktop, Cloud)_
        * Executor _(eg. slurm, local, awsbatch)_
        * Container engine: _(e.g. Apptainer, Singularity, Docker, Conda)_
        * OS _(eg. Rocky Linux, macOS, Ubuntu)_
        * Version of CosciaLab/histo _(eg. 1.1.0, or the commit SHA)_
