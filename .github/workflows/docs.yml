name: Docs site
on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: astral-sh/setup-uv@v6
      # Guarded until tools/site_reference.py lands (Task 2), then unguarded.
      - name: Generate reference pages
        run: if [ -f tools/site_reference.py ]; then uv run tools/site_reference.py; fi
      - name: Install
        working-directory: site
        run: npm ci
      - name: Build
        working-directory: site
        run: BASE_URL=/histo npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_build/html

  links:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - name: Generate reference pages
        run: if [ -f tools/site_reference.py ]; then uv run tools/site_reference.py; fi
      - working-directory: site
        run: npm ci
      - name: Check links
        working-directory: site
        run: BASE_URL=/histo npx myst build --html --check-links

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
