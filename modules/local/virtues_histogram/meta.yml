name: "virtues_histogram"
description: Per-core tissue intensity histograms of one store, the input of the slide statistics.
keywords:
  - virtues
  - spatialdata
  - imaging
tools:
  - "virtues":
      description: "VirTues"
      homepage: "https://github.com/bunnelab/virtues"
      documentation: "https://github.com/bunnelab/virtues"
      tool_dev_url: "https://github.com/bunnelab/virtues"
      licence:
        - "MIT"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'sample1', sample:'sample1' ]
    - sdata_path:
        type: directory
        description: SpatialData Zarr store; only read
        pattern: "*.zarr"
    - spec:
        type: map
        description: Resolved spec with channels ([name, uniprot_id] pairs) and pixel_size
output:
  # main.nf declares no emit names: outputs are positional, in this order.
  hist:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "${meta.sample}_virtues_hist.npz":
          type: file
          description: Histograms per channel, 65536 bins
          pattern: "*_virtues_hist.npz"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
authors:
  - "@josenimo"
maintainers:
  - "@josenimo"
