name: "resolve"
description: Merge one segmentation spec's patch polygons into one GeoParquet, resolving overlaps between patches with sopa. Writes nothing into the store.
keywords:
  - segmentation
  - patches
  - overlap
  - spatialdata
tools:
  - "sopa":
      description: "Technology-invariant pipeline for image-based spatial omics."
      homepage: "https://prism-oncology.github.io/sopa"
      documentation: "https://prism-oncology.github.io/sopa"
      tool_dev_url: "https://github.com/prism-oncology/sopa"
      doi: 10.1038/s41467-024-48981-z
      licence:
        - "BSD-3-Clause"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'sample1', sample:'sample1' ]
    - sdata_path:
        type: directory
        description: SpatialData Zarr store; only read, for the image that cell ids are built on
        pattern: "*.zarr"
    - spec:
        type: map
        description: The segmentation spec the patches were segmented with
    - parquets:
        type: file
        description: One spec's patch polygons from SEGMENT_PATCH, staged as 0.parquet, 1.parquet, ...
        pattern: "*.parquet"
output:
  # main.nf declares no emit names: outputs are positional, in this order.
  shapes:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'sample1', sample:'sample1' ]
      - spec:
          type: map
          description: The segmentation spec, passed through
      - ${spec.name}.parquet:
          type: file
          description: Resolved polygons, named after the spec (e.g. cellpose_cells.parquet)
          pattern: "*.parquet"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
authors:
  - "@josenimo"
maintainers:
  - "@josenimo"
