name: "virtues"
description: Embed the cells, tiles, tissue and niches of one store with the VirTues model.
keywords:
  - virtues
  - spatialdata
  - imaging
tools:
  - "virtues":
      description: "VirTues"
      homepage: "https://github.com/bunnelab/virtues"
      documentation: "https://github.com/bunnelab/virtues"
      tool_dev_url: "https://github.com/bunnelab/virtues"
      licence:
        - "MIT"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'sample1', sample:'sample1' ]
    - sdata_path:
        type: directory
        description: SpatialData Zarr store; only read
        pattern: "*.zarr"
    - methods:
        type: list
        description: Segmentation methods whose cells are embedded
    - spec:
        type: map
        description: Resolved spec with channels, unembedded and pixel_size
    - stats:
        type: file
        description: Slide statistics from VIRTUES_STATS
        pattern: "*_virtues_stats.json"
output:
  # main.nf declares no emit names: outputs are positional, in this order.
  features:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.{h5ad,parquet}":
          type: file
          description: Per-method cell tables, tissue table, niche shapes and table
          pattern: "*.{h5ad,parquet}"
  provenance:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - virtues.json:
          type: file
          description: Provenance of the run
          pattern: "virtues.json"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
authors:
  - "@josenimo"
maintainers:
  - "@josenimo"
