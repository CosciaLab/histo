---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/environment-schema.json
# PATCH: the fork is not on bioconda; this mirrors the image build (untested with -profile conda).
channels:
  - conda-forge
  - bioconda
dependencies:
  - conda-forge::python=3.10
  - conda-forge::openjdk=11
  - conda-forge::numpy<2
  - pip
  - pip:
      - git+https://github.com/josenimo/ashlar.git@v1.22.0+jose.1
