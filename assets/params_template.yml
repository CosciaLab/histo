## -----------------------------------------------------------------------------
## help
## -----------------------------------------------------------------------------
##     Display the help message.
##     Type: ['boolean', 'string']
## -----------------------------------------------------------------------------
# help: null

## -----------------------------------------------------------------------------
## help_full
## -----------------------------------------------------------------------------
##     Display the full detailed help message.
##     Type: boolean
## -----------------------------------------------------------------------------
# help_full: null

## -----------------------------------------------------------------------------
## show_hidden
## -----------------------------------------------------------------------------
##     Display hidden parameters in the help message (only works when --help
##     or --help_full are provided).
##     Type: boolean
## -----------------------------------------------------------------------------
# show_hidden: null


## =============================================================================
## Patches
## =============================================================================
## Tiling of the image before segmentation

## -----------------------------------------------------------------------------
## patch_width_pixel
## -----------------------------------------------------------------------------
##     Width and height of each segmentation patch, in pixels. Choose it so
##     the image yields roughly 16 to 200 patches: patch_width = sqrt(width *
##     height / target_patches).
##     Type: number
## -----------------------------------------------------------------------------
# patch_width_pixel: null

## -----------------------------------------------------------------------------
## patch_overlap_pixel
## -----------------------------------------------------------------------------
##     Overlap between neighbouring patches, in pixels. About twice a cell
##     diameter.
##     Type: number
## -----------------------------------------------------------------------------
# patch_overlap_pixel: null


## =============================================================================
## Tissue segmentation
## =============================================================================
## Parameters related to the tissue segmentation

## -----------------------------------------------------------------------------
## use_tissue_segmentation
## -----------------------------------------------------------------------------
##     Whether to run tissue segmentation
##     Type: boolean
## -----------------------------------------------------------------------------
# use_tissue_segmentation: null

## -----------------------------------------------------------------------------
## level
## -----------------------------------------------------------------------------
##     Level of the image pyramid to use for tissue segmentation
##     Type: number
## -----------------------------------------------------------------------------
# level: null

## -----------------------------------------------------------------------------
## mode
## -----------------------------------------------------------------------------
##     Mode for the tissue segmentation: 'staining' or 'saturation' (for H&E
##     images).
##     Type: string
## -----------------------------------------------------------------------------
# mode: null

## -----------------------------------------------------------------------------
## tissue_segmentation_kwargs
## -----------------------------------------------------------------------------
##     Additional tissue segmentation parameters as a python dict string
##     Type: string
## -----------------------------------------------------------------------------
# tissue_segmentation_kwargs: null


## =============================================================================
## Cell filtering
## =============================================================================
## Filtering low-quality cells during segmentation and aggregation

## -----------------------------------------------------------------------------
## min_area_pixels2
## -----------------------------------------------------------------------------
##     Cells with an area less than this value will be filtered. The unit is
##     in pixels^2, and used by Stardist/Cellpose.
##     Type: number
## -----------------------------------------------------------------------------
# min_area_pixels2: null

## -----------------------------------------------------------------------------
## min_intensity_ratio
## -----------------------------------------------------------------------------
##     Cells whose mean channel intensity is less than `min_intensity_ratio *
##     quantile_90` will be filtered.
##     Type: number
## -----------------------------------------------------------------------------
# min_intensity_ratio: null


## =============================================================================
## Aggregation
## =============================================================================
## Per-cell channel intensities

## -----------------------------------------------------------------------------
## expand_radius_ratio
## -----------------------------------------------------------------------------
##     Expand cell polygons by `expand_radius_ratio * mean_radius` when
##     averaging channel intensities only. Helps capture membrane stainings
##     at the cell boundary.
##     Type: number
## -----------------------------------------------------------------------------
# expand_radius_ratio: null


## =============================================================================
## Image preprocessing
## =============================================================================
## Image preprocessing applied before channel-based segmentation methods
## (cellpose, stardist)

## -----------------------------------------------------------------------------
## gaussian_sigma
## -----------------------------------------------------------------------------
##     Parameter for scipy gaussian_filter (applied before running the
##     segmentation method)
##     Type: number
## -----------------------------------------------------------------------------
# gaussian_sigma: null

## -----------------------------------------------------------------------------
## clip_limit
## -----------------------------------------------------------------------------
##     Parameter for skimage.exposure.equalize_adapthist (applied before
##     running the segmentation method)
##     Type: number
## -----------------------------------------------------------------------------
# clip_limit: null

## -----------------------------------------------------------------------------
## clahe_kernel_size
## -----------------------------------------------------------------------------
##     Parameter for skimage.exposure.equalize_adapthist (applied before
##     running the segmentation method)
##     Type: number
## -----------------------------------------------------------------------------
# clahe_kernel_size: null


## =============================================================================
## Channel projection
## =============================================================================
## Segment a nuclear and a cell channel projected from many markers, for
## 2-channel Cellpose

## -----------------------------------------------------------------------------
## use_projection
## -----------------------------------------------------------------------------
##     Project the marker sheet's channels into a nuclear and a cell
##     (membrane and cytoplasm) channel and segment those with Cellpose.
##     Requires use_cellpose and use_preprocessing; leave cellpose_channels
##     unset.
##     Type: boolean
## -----------------------------------------------------------------------------
# use_projection: null

## -----------------------------------------------------------------------------
## projection_method
## -----------------------------------------------------------------------------
##     How the rescaled markers of a channel are combined. max keeps markers
##     that stain only one cell type at full brightness; mean averages out
##     noise but dims them.
##     Type: string
## -----------------------------------------------------------------------------
# projection_method: "max"

## -----------------------------------------------------------------------------
## projection_low_percentile
## -----------------------------------------------------------------------------
##     Per-marker percentile mapped to 0 before combining. Zero-valued
##     padding is ignored.
##     Type: number
## -----------------------------------------------------------------------------
# projection_low_percentile: 1.0

## -----------------------------------------------------------------------------
## projection_high_percentile
## -----------------------------------------------------------------------------
##     Per-marker percentile mapped to 1 before combining.
##     Type: number
## -----------------------------------------------------------------------------
# projection_high_percentile: 99.9

## -----------------------------------------------------------------------------
## projection_sigma
## -----------------------------------------------------------------------------
##     Gaussian smoothing in pixels applied to each marker before combining;
##     0 for none.
##     Type: number
## -----------------------------------------------------------------------------
# projection_sigma: 1.0


