## ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
##     CosciaLab/histo 1.2.0
## ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
##     This is an example parameter file to pass to the `-params-file` option
##     of nextflow run with the CosciaLab/histo pipeline.
##      
##     Uncomment lines with a single '#' if you want to pass the parameter to
##     the pipeline.
## -----------------------------------------------------------------------------

## =============================================================================
## Input/output options
## =============================================================================
## Define where the pipeline should find input data and save output data.

## -----------------------------------------------------------------------------
## input
## -----------------------------------------------------------------------------
##     Path to a comma-separated samplesheet. Its shape depends on
##     use_preprocessing: one row per acquisition cycle when true, one row
##     per sample when false.
##     Type: string
##     Required
## -----------------------------------------------------------------------------
# input: null

## -----------------------------------------------------------------------------
## outdir
## -----------------------------------------------------------------------------
##     The output directory where the results will be saved. Use an absolute
##     path.
##     Type: string
##     Required
## -----------------------------------------------------------------------------
# outdir: null

## -----------------------------------------------------------------------------
## email
## -----------------------------------------------------------------------------
##     Email address for completion summary.
##     Type: string
## -----------------------------------------------------------------------------
# email: null


## =============================================================================
## Preprocessing
## =============================================================================
## Illumination correction, stitching and registration, optional background
## subtraction and optional TMA dearray. These run before the image enters
## the SpatialData half, and are skipped entirely when use_preprocessing is
## false.

## -----------------------------------------------------------------------------
## use_preprocessing
## -----------------------------------------------------------------------------
##     Run the preprocessing half: illumination correction, stitching and
##     registration, and the optional steps below. When false, each
##     samplesheet row is an already stitched OME-TIFF, such as a dearrayed
##     core re-entering the pipeline.
##     Type: boolean
## -----------------------------------------------------------------------------
# use_preprocessing: true

## -----------------------------------------------------------------------------
## preprocessing_only
## -----------------------------------------------------------------------------
##     Stop after preprocessing: keep the stitched images under
##     preprocessing/ and skip segmentation, quantification and the QC
##     report. Ashlar's own QC is still written when use_qc is true. Requires
##     use_preprocessing; no segmentation backend is needed.
##     Type: boolean
## -----------------------------------------------------------------------------
# preprocessing_only: null

## -----------------------------------------------------------------------------
## skip_reference_dna_check
## -----------------------------------------------------------------------------
##     Run even when Ashlar's alignment channel or Coreograph's dearray
##     channel is not a dna channel in the marker sheet. A warning is logged
##     instead of stopping.
##     Type: boolean
## -----------------------------------------------------------------------------
# skip_reference_dna_check: null

## -----------------------------------------------------------------------------
## ashlar_args
## -----------------------------------------------------------------------------
##     Extra command-line arguments passed through to Ashlar.
##     Type: string
## -----------------------------------------------------------------------------
# ashlar_args: "--maximum-shift 30"

## -----------------------------------------------------------------------------
## use_backsub
## -----------------------------------------------------------------------------
##     Subtract background channels after stitching. Requires exposure and
##     background columns in the marker sheet.
##     Type: boolean
## -----------------------------------------------------------------------------
# use_backsub: null

## -----------------------------------------------------------------------------
## backsub_args
## -----------------------------------------------------------------------------
##     Extra command-line arguments passed through to backsub.
##     Type: string
## -----------------------------------------------------------------------------
# backsub_args: null

## -----------------------------------------------------------------------------
## use_tma_dearray
## -----------------------------------------------------------------------------
##     Split a tissue microarray into individual cores with UNetCoreograph.
##     Each core then runs the downstream half as an independent sample, and
##     the results are merged per slide at the end. Requires
##     use_preprocessing.
##     Type: boolean
## -----------------------------------------------------------------------------
# use_tma_dearray: null

## -----------------------------------------------------------------------------
## coreograph_args
## -----------------------------------------------------------------------------
##     Extra command-line arguments passed through to UNetCoreograph.
##     Type: string
## -----------------------------------------------------------------------------
# coreograph_args: "--downsampleFactor 5 --channel 0 --buffer 2"


