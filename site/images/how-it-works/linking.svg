<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" font-family="sans-serif" font-size="12">
  <rect width="480" height="220" fill="#ffffff"/>
  <!-- cell A: nucleus inside, linked; cytoplasm is the cell minus the nucleus -->
  <ellipse cx="110" cy="90" rx="70" ry="50" fill="#cfe8cf" stroke="#2e7d32" stroke-width="2"/>
  <circle cx="118" cy="92" r="22" fill="#f4b6c2" stroke="#ad1457" stroke-width="2"/>
  <text x="110" y="166" fill="#111111" text-anchor="middle">nucleus linked</text>
  <text x="110" y="182" fill="#444444" text-anchor="middle">(at least half inside)</text>
  <!-- cell B: nucleus mostly outside, not linked; no cytoplasm -->
  <ellipse cx="320" cy="90" rx="70" ry="50" fill="#f2f2f2" stroke="#2e7d32" stroke-width="2"/>
  <circle cx="392" cy="80" r="22" fill="none" stroke="#ad1457" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="330" y="166" fill="#111111" text-anchor="middle">nucleus not linked</text>
  <text x="330" y="182" fill="#444444" text-anchor="middle">(less than half inside)</text>
  <!-- legend -->
  <rect x="40" y="198" width="12" height="12" fill="#cfe8cf" stroke="#2e7d32"/>
  <text x="58" y="208" fill="#111111">cytoplasm</text>
  <rect x="140" y="198" width="12" height="12" fill="#f4b6c2" stroke="#ad1457"/>
  <text x="158" y="208" fill="#111111">nucleus compartment</text>
  <rect x="300" y="198" width="12" height="12" fill="#f2f2f2" stroke="#2e7d32"/>
  <text x="318" y="208" fill="#111111">cell, no cytoplasm</text>
</svg>
