# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "instanseg"
description: Segment cells with InstanSeg, one task per image patch, then resolve boundaries across patch borders
keywords:
  - segmentation
  - instanseg
  - spatial
  - imaging
components:
  - patch/segmentation/instanseg
  - resolve/instanseg
  - argscli
input:
  - ch_patches:
      type: file
      description: |
        Channel containing a SpatialData Zarr store and its image patches file.
        Structure: [ val(meta), path(sdata_path), path(patches_file_image) ]
  - ch_markers:
      type: file
      description: |
        Channel containing each sample's marker sheet, read for the default channels when
        instanseg_channels is unset. May be empty when instanseg_channels is set.
        Structure: [ val(meta), path(csv) ]
output:
  - ch_resolved:
      type: file
      description: |
        Channel containing the SpatialData Zarr store with resolved cell boundaries
        written to the instanseg_boundaries shapes element.
        Structure: [ val(meta), path(sdata_path) ]
  - ch_versions:
      type: file
      description: |
        Channel containing software versions.
        Structure: [ path(versions.yml) ]
authors:
  - "@quentinblampey"
  - "@josenimo"
maintainers:
  - "@josenimo"
